<header><div class="brand"><div class="brandmark">◩</div><div><h1>截图工作室</h1><small id="title">让文章里的重点，一眼可见</small></div></div><div class="spacer"></div><span id="status" class="status">正在载入…</span><button id="save" title="保存可继续编辑的标注和布局；修改后也会自动保存">保存项目</button><button id="download">导出单张</button><button id="exportAll">导出全部</button><button id="returnArticle" class="primary" disabled>再导入回文章 ↗</button></header>
<div class="layout"><aside id="list"><h3>文章截图 <span id="count"></span></h3><button id="addImages" style="width:100%;margin-bottom:10px">＋ 添加图片</button><input id="imageUpload" type="file" accept="image/png,image/jpeg,image/webp" multiple hidden><p id="addMessage" class="hint" role="status">可多选 PNG、JPG、WebP。手动添加的图片可编辑和导出，暂不自动回填文章。</p><div id="thumbs"></div><div id="excluded" class="hint"></div></aside>
<main><div class="workhead"><div><div class="eyebrow">SCREENSHOT STUDIO</div><div class="work-title">让重点，一眼可见。</div></div><span class="hint" id="returnNote">正在检查文章来源</span></div><div class="tools"><button data-tool="select" class="active">选择</button><button data-tool="rect">框选</button><button data-tool="mosaic">马赛克</button><button data-tool="arrow">箭头</button><button data-tool="text">文字</button><button data-tool="number">序号</button><button id="undo">撤销</button><button id="redo">重做</button></div><div id="stage"><canvas id="canvas"></canvas></div><div class="stage-footer"><span class="hint" id="context"></span><button id="review">标记已检查</button></div><p id="notice"></p></main>
<aside id="inspector"><div class="inspector-tabs"><button data-panel="annotation">标注</button><button data-panel="appearance" class="active">外观</button></div><div id="appearancePanel"><h3>画布氛围</h3><p class="section-note">统一的底色，让整篇文章更有秩序。</p><div id="palette" class="palette"></div><label>自定义背景图</label><input id="bgUpload" type="file" accept="image/png,image/jpeg,image/webp"><button id="clearBg" style="margin-top:8px">移除背景图</button><div class="row"><div><label>渐变起点</label><input id="color1" type="color"></div><div><label>渐变终点</label><input id="color2" type="color"></div></div><label>画布比例</label><select id="ratio"><option value="custom">自定义</option><option value="auto">适应截图</option><option value="16:9">16:9</option><option value="3:2">3:2</option><option value="4:3">4:3</option><option value="1:1">1:1</option><option value="9:16">9:16</option></select><div class="row"><div><label>宽度 px</label><input id="width" type="number" min="320" max="4096"></div><div><label>高度 px</label><input id="height" type="number" min="320" max="4096"></div></div>
<label>留白 <span id="paddingValue"></span></label><input id="padding" type="range" min="0" max="300"><label>截图缩放 <span id="scaleValue"></span></label><input id="scale" type="range" min="0.2" max="1.5" step="0.01"><label>圆角</label><input id="radius" type="range" min="0" max="80"><label>阴影</label><input id="shadow" type="range" min="0" max="70"><h3 style="border-top:1px solid var(--line);padding-top:22px">IP 水印</h3><label><input id="wmEnabled" type="checkbox"> 添加 IP 水印</label><p class="hint" id="wmHint">默认压住截图右下角；使用选择工具拖动印章，避开重要内容。</p><div style="display:flex;align-items:center;gap:12px"><img id="wmPreview" style="width:58px;height:58px;object-fit:contain;border-radius:12px;background:#eee"><span id="wmName" class="hint"></span></div><label>上传自己的水印</label><input id="wmUpload" type="file" accept="image/png,image/jpeg,image/webp"><button id="wmReset" style="margin-top:8px">恢复默认水印</button><div class="row"><div><label>位置</label><select id="wmPosition"><option value="right">右下叠盖</option><option value="left">左下叠盖</option></select></div><div><label>大小</label><select id="wmSize"><option value="80">小</option><option value="112">中</option><option value="152">较大</option><option value="182">大</option></select></div></div><p id="wmDimensions" class="hint"></p><div class="field-actions"><button id="resetPos">截图居中</button><button id="applyStyle">应用到全部</button></div>
</div><div id="annotationPanel" hidden><h3>标注细节</h3><div id="layers"></div><select id="objectPicker" aria-label="选择同类标注" hidden></select><div id="empty">选择画面中的标注<br>或使用上方工具添加一个</div><div id="props" hidden><div id="visualFields"><div id="textFields"><label>文字内容</label><textarea id="annotationText"></textarea></div><div class="row"><div><label>颜色</label><input id="annotationColor" type="color"></div><div id="fontField"><label>字号 / 序号大小</label><input id="fontSize" type="number" min="12" max="100"></div></div></div><div id="lineOptions"><label>线条粗细</label><div class="segments" id="lineWeights"><button data-weight="2"><i class="weight" style="height:2px"></i>细</button><button data-weight="4"><i class="weight" style="height:4px"></i>中</button><button data-weight="6"><i class="weight" style="height:6px"></i>粗</button></div><label>线条样式</label><div class="segments"><button data-dash="solid">━━━━ 实线</button><button data-dash="dashed">┄┄┄ 虚线</button></div><div id="arcOptions"><label>箭头走向</label><div class="segments"><button data-bend="auto">自动</button><button data-bend="0">直线</button><button data-bend="0.14">轻弧</button><button data-bend="-0.14">反向弧</button></div></div></div><div id="mosaicOptions" hidden><label>马赛克强度</label><div class="segments"><button data-mosaic="12">小</button><button data-mosaic="20">中</button><button data-mosaic="32">大</button></div><p class="hint">块越大，遮挡越明显。默认使用中等强度。</p></div><details><summary>精确位置</summary><div class="row"><div><label>X %</label><input id="ax" type="number" step="0.1"></div><div><label>Y %</label><input id="ay" type="number" step="0.1"></div><div><label id="wl">宽 %</label><input id="aw" type="number" step="0.1"></div><div><label id="hl">高 %</label><input id="ah" type="number" step="0.1"></div></div></details><button id="delete" class="danger" style="margin-top:10px">删除标注</button></div></div></aside></div>
<dialog id="exportResult"><h2 id="exportHeading">正在导出…</h2><p id="exportMessage" role="status" aria-live="polite"></p><code id="exportPath"></code><p><button id="openExport" hidden>打开文件夹</button><a id="exportLink" hidden download>下载文件</a><button id="closeExport">关闭</button></p></dialog>
<script>
'use strict';
const $=id=>document.getElementById(id),cv=$('canvas'),ctx=cv.getContext('2d');
let project,index=0,selected=-1,tool='select',layerCategory='rect',token,undoStack=[],redoStack=[],drag=null,saveTimer=null,saveQueue=Promise.resolve(),dirty=0,savedRevision=0,pen={lineWidth:4,lineStyle:'solid',bend:null};
const previews=new Map(),cache=new Map(),clone=o=>JSON.parse(JSON.stringify(o)),S=()=>project.slides[index],A=()=>S().annotations[selected];
const presets=[['#b7dfd6','#e9edf6'],['#087f8c','#b5e8ba'],['#8c84e8','#ecc5ee'],['#172855','#65c6d2'],['#ff9777','#ffcfac'],['#e7eaf0','#fcfcfd'],['#ffc7df','#a9caff'],['#131b30','#644d94'],['#d6f4d4','#f6edce'],['#ffffff','#ffffff']];
function image(src){if(!cache.has(src))cache.set(src,new Promise((resolve,reject)=>{let im=new Image();im.onload=()=>resolve(im);im.onerror=()=>reject(Error('无法读取图片'));im.src=src}));return cache.get(src)}
function status(t,error=false){$('status').textContent=t.length>24?(error?'操作未完成':'已完成'):t;$('notice').textContent=t.length>24?t:'';$('status').style.color=error?'#b9383a':'#527566'}
function checkpoint(){undoStack.push(clone(project));if(undoStack.length>40)undoStack.shift();redoStack=[]}
function changed(){S().reviewed=false;dirty++;draw();renderList();scheduleSave()}
function scheduleSave(){clearTimeout(saveTimer);status('等待保存…');saveTimer=setTimeout(()=>save().catch(e=>status(e.message,true)),600)}
async function post(path,obj){let r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json','X-Editor-Token':token},body:JSON.stringify(obj)});let data=await r.json();if(!r.ok)throw Error(data.error||'保存失败');return data}
function save(){clearTimeout(saveTimer);saveTimer=null;let snapshot=clone(project),revision=dirty;saveQueue=saveQueue.catch(()=>{}).then(()=>post('/save',snapshot)).then(()=>{savedRevision=revision;if(dirty===revision)status('项目已保存 · 可继续编辑')});return saveQueue}
function geometry(slide,im){let s=slide.style;let k=Math.min(Math.max(1,s.width-2*s.padding)/im.width,Math.max(1,s.height-2*s.padding)/im.height)*s.scale;return {x:(s.width-im.width*k)/2+s.offsetX,y:(s.height-im.height*k)/2+s.offsetY,w:im.width*k,h:im.height*k}}
function round(c,x,y,w,h,r){c.beginPath();c.roundRect(x,y,w,h,Math.min(r,w/2,h/2))}
function pos(a,g){return {x:g.x+a.x*g.w,y:g.y+a.y*g.h,w:(a.w||0)*g.w,h:(a.h||0)*g.h,x2:g.x+(a.x2||0)*g.w,y2:g.y+(a.y2||0)*g.h}}
function automaticBend(p){return Math.abs(p.y2-p.y)<=Math.abs(p.x2-p.x)*.08?0:.14}
function curve(a,p){let bend=a.bend??automaticBend(p);return{x:(p.x+p.x2)/2-(p.y2-p.y)*bend,y:(p.y+p.y2)/2+(p.x2-p.x)*bend}}
function curvePoint(p,q,t){return [(1-t)**2*p.x+2*(1-t)*t*q.x+t*t*p.x2,(1-t)**2*p.y+2*(1-t)*t*q.y+t*t*p.y2]}
function font(c,size,weight=600){c.font=`${weight} ${size}px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif`}
function annotationFontSize(a){return a.fontSize||(a.type==='text'?48:28)}
function mosaicBlock(a){return [12,20,32].includes(Number(a.blockSize))?Number(a.blockSize):20}
function paintMosaic(c,im,g,a,radius){let p=pos(a,g),left=Math.max(g.x,Math.min(p.x,p.x+p.w)),top=Math.max(g.y,Math.min(p.y,p.y+p.h)),right=Math.min(g.x+g.w,Math.max(p.x,p.x+p.w)),bottom=Math.min(g.y+g.h,Math.max(p.y,p.y+p.h));if(right<=left||bottom<=top)return;let block=mosaicBlock(a),tiny=document.createElement('canvas');tiny.width=Math.max(1,Math.ceil((right-left)/block));tiny.height=Math.max(1,Math.ceil((bottom-top)/block));let tc=tiny.getContext('2d'),sx=(left-g.x)*im.width/g.w,sy=(top-g.y)*im.height/g.h,sw=(right-left)*im.width/g.w,sh=(bottom-top)*im.height/g.h;tc.drawImage(im,sx,sy,sw,sh,0,0,tiny.width,tiny.height);c.save();round(c,g.x,g.y,g.w,g.h,radius);c.clip();c.imageSmoothingEnabled=false;c.drawImage(tiny,0,0,tiny.width,tiny.height,left,top,right-left,bottom-top);c.restore()}
function watermark(slide){return {enabled:!!project.defaultWatermark,size:182,position:'right',...slide.style.watermark}}
function watermarkSrc(slide){let w=watermark(slide);return w.enabled?(w.src||project.defaultWatermark||null):null}
function watermarkBox(slide,g){let w=watermark(slide),size=Number(w.size),s=slide.style;return {size,x:Math.max(0,Math.min(s.width-size,w.x==null?(w.position==='left'?g.x-size*.7:g.x+g.w-size*.3):w.x*s.width)),y:Math.max(0,Math.min(s.height-size,w.y==null?g.y+g.h-size*.3:w.y*s.height))}}
function refreshWatermark(){let w=watermark(S());$('wmEnabled').checked=w.enabled;$('wmPosition').value=w.position;$('wmSize').value=w.size;let src=w.src||project.defaultWatermark;$('wmPreview').src=src||'';$('wmPreview').style.visibility=src?'visible':'hidden';$('wmName').textContent=w.src?'本张自定义水印':src?'默认水印':'未设置水印：上传一张图片即可使用';$('wmReset').disabled=!project.defaultWatermark;$('wmDimensions').textContent=`含水印导出尺寸：${S().style.width} × ${S().style.height} px`}
async function paint(slide,canvas,selection=-1){let im=await image(slide.image),s=slide.style,c=canvas.getContext('2d');canvas.width=s.width;canvas.height=s.height;let bg=c.createLinearGradient(0,0,s.width,s.height);bg.addColorStop(0,s.bg[0]);bg.addColorStop(1,s.bg[1]);c.fillStyle=bg;c.fillRect(0,0,s.width,canvas.height);
if(s.bgImage){let bi=await image(s.bgImage),k=Math.max(s.width/bi.width,canvas.height/bi.height);c.drawImage(bi,(s.width-bi.width*k)/2,(canvas.height-bi.height*k)/2,bi.width*k,bi.height*k)}
let g=geometry(slide,im);c.save();c.shadowColor='#152b3b40';c.shadowBlur=s.shadow;c.shadowOffsetY=s.shadow/2;c.fillStyle='white';round(c,g.x,g.y,g.w,g.h,s.radius);c.fill();c.restore();c.save();round(c,g.x,g.y,g.w,g.h,s.radius);c.clip();c.drawImage(im,g.x,g.y,g.w,g.h);c.restore();
slide.annotations.filter(a=>a.type==='mosaic').forEach(a=>paintMosaic(c,im,g,a,s.radius));

$('wmUpload').onchange=async e=>{let f=e.target.files[0],slideId=S().id;if(!f)return;try{if(!['image/png','image/jpeg','image/webp'].includes(f.type)||f.size>20*1024*1024)throw Error('请上传不超过 20 MB 的 PNG、JPG 或 WebP 水印');let src=await new Promise((resolve,reject)=>{let r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(Error('水印读取失败'));r.readAsDataURL(f)});await image(src);if(S().id!==slideId)throw Error('已切换截图，请在目标截图重新上传水印');checkpoint();S().style.watermark={...watermark(S()),enabled:true,src};refreshWatermark();changed()}catch(err){status(err.message,true)}finally{e.target.value=''}};
$('returnArticle').onclick=async()=>{let b=$('returnArticle');b.disabled=true;try{await save();let snapshot=clone(project),images=[];for(let s of snapshot.slides.filter(s=>!s.manualAdded))images.push({id:s.id,png:await raster(s)});let r=await post('/return-article',{images}),skipped=r.skipped?`；跳过已从文章删除的 ${r.skipped} 处`:'',action=r.mode==='overwrite'?'已覆盖':'已替换',backup=r.image_backup?`旧成图备份：${r.image_backup}`:`文章备份：${r.backup}`;status(`${action} ${r.count} 处截图${skipped}，文章已保存。${backup}`);$('returnNote').textContent='已导入 · 继续调整后可再次覆盖'}catch(e){status(e.message,true)}finally{b.disabled=false}};
window.addEventListener('beforeunload',e=>{if(dirty!==savedRevision){e.preventDefault();e.returnValue=''}});
(async()=>{try{let [p,t]=await Promise.all([fetch('/project.json').then(r=>r.json()),fetch('/session').then(r=>r.json())]);project=p;project.defaultWatermark ||= t.defaultWatermark;token=t.token;$('returnArticle').disabled=!t.article;$('returnNote').textContent=t.article?`导入目标：${t.article}`:'演示项目 · 提供文章后可一键导入';$('title').textContent=p.title;await Promise.all(p.slides.map(s=>image(s.image)));refresh();status('已载入 · 修改后自动保存')}catch(e){status('载入失败：'+e.message,true)}})();
</script></html>
